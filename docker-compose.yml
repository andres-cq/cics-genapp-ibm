version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: genapp-postgres
    environment:
      POSTGRES_DB: genapp
      POSTGRES_USER: genapp
      POSTGRES_PASSWORD: genapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genapp"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - genapp-network

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: genapp-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: genapp
      DB_USER: genapp
      DB_PASSWORD: genapp
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - genapp-network

  # Angular Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: genapp-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - genapp-network

volumes:
  postgres_data:
    driver: local

networks:
  genapp-network:
    driver: bridge

